<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
<title>Çarpım Kulesi — Çarpım Tablosu</title>
<link rel="stylesheet" href="../shared/mf-design.css">
<style>
/* ============================================================
   Multiplication Tower / Çarpım Kulesi — General
   Target concept: multiplication tables 1-10 (products up to 100)
   Modes: multiple-choice + manual entry. Player picks a product
   range level before starting.
   ============================================================ */

.ambient { position: absolute; inset: 0; pointer-events: none; z-index: 0; }

main {
  position: relative; z-index: 2; flex: 1;
  display: flex; flex-direction: column;
  align-items: center; gap: 0.7rem;
  padding: 1rem 0.75rem 100px;
  overflow-y: auto;
}

/* ---- Header extras ---- */
.header-end {
  flex: 1;
  max-width: 540px;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.difficulty-badge.medium { background: var(--b4); color: #fff; }
.difficulty-badge.hard   { background: var(--b1); color: #fff; }
.difficulty-badge.all    { background: var(--b5); color: #fff; }

/* ---- Prompt card ---- */
.prompt-card {
  width: min(820px, 96vw);
  background: rgba(255,255,255,0.92);
  border: 4px solid var(--ink);
  border-radius: 16px;
  padding: 0.55rem 1rem;
  box-shadow: 5px 5px 0 var(--ink);
  text-align: center;
  position: relative;
}
.prompt-card::before, .prompt-card::after {
  content: "";
  position: absolute;
  top: -10px;
  width: 16px; height: 16px;
  background: var(--sun);
  border: 3px solid var(--ink);
  border-radius: 50%;
  box-shadow: 1px 2px 0 var(--ink);
}
.prompt-card::before { left: -10px; }
.prompt-card::after  { right: -10px; }
.instruction {
  font-size: clamp(0.95rem, 2.4vw, 1.2rem);
  font-weight: 800;
  color: var(--ink);
}

/* ---- Equation card ---- */
.equation-card {
  width: min(820px, 96vw);
  background: rgba(255,255,255,0.7);
  border: 4px solid var(--ink);
  border-radius: 18px;
  padding: 1.3rem 0.75rem;
  box-shadow: 5px 5px 0 var(--ink);
}
.equation {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 0.35rem 0.5rem;
  font-size: clamp(2.2rem, 9vw, 4.2rem);
  font-weight: 900;
  color: var(--ink);
  line-height: 1;
}
.eq-op, .eq-eq {
  color: var(--warm);
  text-shadow: 3px 3px 0 var(--ink);
}
.eq-slot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1.6em;
  padding: 0.05em 0.25em;
  border: 4px dashed var(--warm);
  border-radius: 14px;
  background: #fff;
  color: var(--warm);
  text-shadow: 2px 2px 0 var(--ink);
}
.eq-slot.active {
  border-style: solid;
  border-color: var(--good);
  animation: slotPulse 1.1s ease-in-out infinite;
}
@keyframes slotPulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.07); }
}
.eq-slot.correct-flash { animation: correctPulse 0.6s ease; background: var(--good) !important; color: #fff; }
.eq-slot.wrong-flash   { animation: wrongShake  0.5s ease;  background: var(--bad)  !important; color: #fff; }

/* ---- Multiple-choice answers (reuses shared .answer-area / .choice-btn) ---- */
.answer-area { margin-top: 0.2rem; }

/* ---- Numpad area ---- */
.numpad-area {
  width: min(360px, 95vw);
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  align-items: center;
}
.numpad-hint {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--ink);
  background: rgba(255,255,255,0.88);
  padding: 0.3rem 0.7rem;
  border-radius: 8px;
  border: 2px solid var(--ink);
  text-align: center;
}
.numpad { width: 100%; }
.numpad button { font-size: 1.4rem; padding: 0.55rem 0; }
.numpad button.action { background: var(--warm); color: #fff; }
.numpad button.submit { background: var(--good);  color: #fff; }

.action-row {
  width: min(360px, 95vw);
  display: flex;
  gap: 0.5rem;
  justify-content: center;
}
.action-btn {
  font-family: inherit;
  font-weight: 900;
  font-size: clamp(0.9rem, 2.3vw, 1.05rem);
  padding: 0.55rem 1.1rem;
  border: 4px solid var(--ink);
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 4px 4px 0 var(--ink);
}
.action-btn.check  { background: var(--good); color: #fff; flex: 2; min-width: 120px; }
.action-btn.clear  { background: #fff;        color: var(--ink); flex: 1; min-width: 90px; }
.action-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
.action-btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.action-btn[disabled] { opacity: 0.4; cursor: not-allowed; }

/* ---- Level select overlay ---- */
.level-modal {
  position: fixed;
  inset: 0;
  background: rgba(31,29,44,0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 120;
  padding: 1rem;
  backdrop-filter: blur(4px);
}
.level-modal[hidden] { display: none; }
.level-card {
  background: #fff;
  border: 5px solid var(--ink);
  border-radius: 24px;
  padding: 1.5rem;
  box-shadow: 10px 10px 0 var(--ink);
  text-align: center;
  max-width: 520px;
  width: 94vw;
  animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
}
.level-card h2 {
  font-size: clamp(1.5rem, 5vw, 2.1rem);
  color: var(--warm);
  text-shadow: 3px 3px 0 var(--ink);
  margin-bottom: 0.4rem;
}
.level-caption {
  font-weight: 700;
  color: var(--ink-soft);
  margin-bottom: 1.1rem;
}
.level-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.8rem;
}
.level-btn {
  font-family: inherit;
  cursor: pointer;
  border: 4px solid var(--ink);
  border-radius: 16px;
  padding: 1rem 0.5rem;
  box-shadow: 5px 5px 0 var(--ink);
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  align-items: center;
  color: #fff;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.level-btn:hover  { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); }
.level-btn:active { transform: translate(2px, 2px);   box-shadow: 2px 2px 0 var(--ink); }
.level-btn:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }
.level-btn .lv-name  { font-size: 1.4rem; font-weight: 900; text-shadow: 2px 2px 0 rgba(0,0,0,0.28); }
.level-btn .lv-range {
  font-size: 1rem;
  font-weight: 800;
  background: rgba(255,255,255,0.9);
  color: var(--ink);
  border: 2px solid var(--ink);
  border-radius: 8px;
  padding: 0.05rem 0.55rem;
}
.level-btn.easy   { background: var(--good); }
.level-btn.medium { background: var(--b4); }
.level-btn.hard   { background: var(--b1); }
.level-btn.all    { background: var(--b5); }

/* ---- Mobile tweaks ---- */
@media (max-width: 560px) {
  .header-end { max-width: none; }
  .numpad-area { width: 95vw; }
  .equation { font-size: clamp(2rem, 12vw, 3rem); }
}
@media (max-width: 420px) {
  .level-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="app">

  <!-- Ambient background layers -->
  <div class="ambient" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
  </div>
  <div class="road" aria-hidden="true">
    <div class="car car-1">🚗</div>
    <div class="car car-2">🚙</div>
    <div class="car car-3">🚕</div>
  </div>

  <!-- Header -->
  <header>
    <div class="title" id="titleEl">✖️ Çarpım Kulesi</div>
    <div class="header-end">
      <span class="difficulty-badge" id="difficultyBadge"></span>
      <div class="progress-wrap" role="progressbar"
           aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"
           aria-label="İlerleme" id="progressBar">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">0 / 10</div>
      </div>
      <button class="lang-toggle" id="langToggleBtn" type="button">EN</button>
    </div>
  </header>

  <!-- Main game area -->
  <main>

    <!-- Prompt -->
    <section class="prompt-card">
      <div class="instruction" id="instruction"></div>
    </section>

    <!-- Equation -->
    <section class="equation-card" id="equationCard" hidden>
      <div class="equation" id="equation"></div>
    </section>

    <!-- Multiple-choice answers -->
    <div class="answer-area" id="choiceArea" hidden></div>

    <!-- Numpad (manual entry) -->
    <div class="numpad-area" id="numpadArea" hidden>
      <div class="numpad-hint" id="numpadHint"></div>
      <div class="numpad" id="numpad">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" class="action" data-key="back" id="backspaceBtn">⌫</button>
        <button type="button" data-key="0">0</button>
        <button type="button" class="submit" data-key="enter" id="enterBtn">↵</button>
      </div>
      <div class="action-row">
        <button class="action-btn clear" id="clearBtn" type="button">🧹 Temizle</button>
        <button class="action-btn check" id="checkBtn" type="button">✓ Kontrol</button>
      </div>
    </div>

    <!-- Feedback -->
    <div class="feedback" id="feedback" aria-live="polite"></div>

  </main>

  <!-- Level select overlay -->
  <div class="level-modal" id="levelModal"
       role="dialog" aria-modal="true" aria-labelledby="levelTitle">
    <div class="level-card">
      <h2 id="levelTitle">Bir seviye seç</h2>
      <p class="level-caption" id="levelCaption">Çarpım aralığını seç</p>
      <div class="level-grid" id="levelGrid"></div>
    </div>
  </div>

  <!-- Reward modal -->
  <div class="reward-modal" id="rewardModal" hidden
       role="dialog" aria-modal="true" aria-labelledby="rewardTitle">
    <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
    <div class="reward-card">
      <h2 id="rewardTitle">🎉 Çarpım Ustası! 🎉</h2>
      <div class="reward-image-wrap" id="rewardImageWrap"></div>
      <p class="reward-msg" id="rewardMsg">Çarpım tablosunda ustalaştın!</p>
      <button class="play-again" id="playAgainBtn" type="button">Tekrar Oyna</button>
    </div>
  </div>

</div>
<script src="../shared/mf-core.js"></script>
<script>
(() => {
  'use strict';

  const { rand, pick, shuffle, loadRewards, chooseReward, mountReward,
          spawnConfetti, trapFocus, releaseFocus } = MF;

  /* ---------- Config ---------- */
  const TARGET_PROGRESS = 10;
  const INCREMENT_RIGHT = 1;
  const DECREMENT_WRONG = 1;
  const FEEDBACK_DELAY  = 1300;

  /* Product-range levels chosen before the game starts */
  const LEVEL_ORDER = ['easy', 'mid', 'hard', 'all'];
  const LEVELS = {
    easy: { min: 1,  max: 50,  nameKey: 'levelEasy', cls: 'easy'   },
    mid:  { min: 31, max: 70,  nameKey: 'levelMid',  cls: 'medium' },
    hard: { min: 71, max: 100, nameKey: 'levelHard', cls: 'hard'   },
    all:  { min: 1,  max: 100, nameKey: 'levelAll',  cls: 'all'    },
  };

  /* ---------- Bilingual strings ---------- */
  const STRINGS = {
    en: {
      title:        '✖️ Multiplication Tower',
      langToggle:   'TR',
      progressAria: 'Progress',

      levelTitle:   'Choose a level',
      levelCaption: 'Pick the product range',
      levelEasy:    'Easy',
      levelMid:     'Medium',
      levelHard:    'Hard',
      levelAll:     'All',

      instrProduct:  'What is the product?',
      numpadProduct: 'Type the product, then ↵',
      fillFirst:     '✖️ Type an answer first!',

      checkBtn:      '✓ Check',
      clearBtn:      '🧹 Clear',
      backspaceAria: 'Backspace',
      enterAria:     'Check answer',
      slotAria:      'Empty answer box',

      praise: ['✖️ Correct!', '⭐ Perfect!', '✨ Brilliant!', '🏢 Tower rising!', '🌟 Sharp!'],
      wrong:  (ans) => `✖️ The answer was ${ans}. Keep going!`,

      rewardTitle:   '🎉 Multiplication Master! 🎉',
      rewardMsg:     'You mastered the times tables!',
      playAgain:     'Play Again',
      rewardMissing: '(reward image missing)',
    },
    tr: {
      title:        '✖️ Çarpım Kulesi',
      langToggle:   'EN',
      progressAria: 'İlerleme',

      levelTitle:   'Bir seviye seç',
      levelCaption: 'Çarpım aralığını seç',
      levelEasy:    'Kolay',
      levelMid:     'Orta',
      levelHard:    'Zor',
      levelAll:     'Hepsi',

      instrProduct:  'Çarpım kaç?',
      numpadProduct: 'Çarpımı yaz, sonra ↵',
      fillFirst:     '✖️ Önce bir cevap yaz!',

      checkBtn:      '✓ Kontrol',
      clearBtn:      '🧹 Temizle',
      backspaceAria: 'Geri sil',
      enterAria:     'Cevabı kontrol et',
      slotAria:      'Boş cevap kutusu',

      praise: ['✖️ Doğru!', '⭐ Mükemmel!', '✨ Harika!', '🏢 Kule yükseliyor!', '🌟 Süper!'],
      wrong:  (ans) => `✖️ Cevap ${ans} idi. Devam et!`,

      rewardTitle:   '🎉 Çarpım Ustası! 🎉',
      rewardMsg:     'Çarpım tablosunda ustalaştın!',
      playAgain:     'Tekrar Oyna',
      rewardMissing: '(ödül resmi eksik)',
    },
  };

  /* ---------- i18n ---------- */
  let lang = localStorage.getItem('mf_lang') || 'tr';
  const S = (k, ...a) => {
    const v = STRINGS[lang][k];
    return typeof v === 'function' ? v(...a) : v;
  };

  const rewardStore = loadRewards();

  /* ---------- DOM refs ---------- */
  const $titleEl      = document.getElementById('titleEl');
  const $instruction  = document.getElementById('instruction');
  const $equationCard = document.getElementById('equationCard');
  const $equation     = document.getElementById('equation');
  const $choiceArea   = document.getElementById('choiceArea');
  const $numpadArea   = document.getElementById('numpadArea');
  const $numpad       = document.getElementById('numpad');
  const $numpadHint   = document.getElementById('numpadHint');
  const $checkBtn     = document.getElementById('checkBtn');
  const $clearBtn     = document.getElementById('clearBtn');
  const $backspaceBtn = document.getElementById('backspaceBtn');
  const $enterBtn     = document.getElementById('enterBtn');
  const $feedback     = document.getElementById('feedback');
  const $progressFill = document.getElementById('progressFill');
  const $progressText = document.getElementById('progressText');
  const $progressBar  = document.getElementById('progressBar');
  const $diffBadge    = document.getElementById('difficultyBadge');
  const $levelModal   = document.getElementById('levelModal');
  const $levelTitle   = document.getElementById('levelTitle');
  const $levelCaption = document.getElementById('levelCaption');
  const $levelGrid    = document.getElementById('levelGrid');
  const $rewardModal  = document.getElementById('rewardModal');
  const $rewardTitle  = document.getElementById('rewardTitle');
  const $rewardMsg    = document.getElementById('rewardMsg');
  const $rewardImgWrap = document.getElementById('rewardImageWrap');
  const $confetti     = document.getElementById('confettiLayer');
  const $playAgainBtn = document.getElementById('playAgainBtn');
  const $langToggleBtn = document.getElementById('langToggleBtn');

  /* ---------- State ---------- */
  const state = {
    level:      null,
    range:      [1, 100],
    validPairs: [],
    progress:   0,
    current:    null,
    locked:     false,
    typed:      '',
  };

  /* ---------- Static strings ---------- */
  function applyStaticStrings() {
    document.documentElement.lang = lang;
    document.title = lang === 'tr'
      ? 'Çarpım Kulesi — Çarpım Tablosu'
      : 'Multiplication Tower — Times Tables';
    $titleEl.textContent       = S('title');
    $langToggleBtn.textContent = S('langToggle');
    $checkBtn.textContent      = S('checkBtn');
    $clearBtn.textContent      = S('clearBtn');
    $backspaceBtn.setAttribute('aria-label', S('backspaceAria'));
    $enterBtn.setAttribute('aria-label',     S('enterAria'));
    $rewardTitle.textContent   = S('rewardTitle');
    $rewardMsg.textContent     = S('rewardMsg');
    $playAgainBtn.textContent  = S('playAgain');
    $progressBar.setAttribute('aria-label', S('progressAria'));
    $levelTitle.textContent    = S('levelTitle');
    $levelCaption.textContent  = S('levelCaption');
    renderLevelButtons();
    updateDiffBadge();
  }

  function setLang(next) {
    lang = next;
    localStorage.setItem('mf_lang', lang);
    applyStaticStrings();
    if (state.current) renderQuestion(state.current);
  }

  /* ---------- Difficulty badge (shows chosen level) ---------- */
  function updateDiffBadge() {
    if (!state.level) { $diffBadge.textContent = ''; $diffBadge.className = 'difficulty-badge'; return; }
    const lv = LEVELS[state.level];
    $diffBadge.textContent = S(lv.nameKey) + ' ' + lv.min + '–' + lv.max;
    $diffBadge.className    = 'difficulty-badge ' + lv.cls;
  }
  function updateProgress() {
    const pct = (state.progress / TARGET_PROGRESS) * 100;
    $progressFill.style.width = pct + '%';
    $progressText.textContent = state.progress + ' / ' + TARGET_PROGRESS;
    $progressBar.setAttribute('aria-valuenow', String(state.progress));
    updateDiffBadge();
  }

  /* ---------- Level select ---------- */
  function renderLevelButtons() {
    $levelGrid.innerHTML = '';
    LEVEL_ORDER.forEach(key => {
      const lv = LEVELS[key];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'level-btn ' + lv.cls;
      btn.dataset.level = key;
      btn.innerHTML =
        '<span class="lv-name">' + S(lv.nameKey) + '</span>' +
        '<span class="lv-range">' + lv.min + '–' + lv.max + '</span>';
      btn.addEventListener('click', () => startGame(key));
      $levelGrid.appendChild(btn);
    });
  }

  function showLevelSelect() {
    state.current = null;
    state.locked  = false;
    releaseFocus($rewardModal);
    $rewardModal.hidden = true;
    $confetti.innerHTML = '';
    $equationCard.hidden = true;
    $choiceArea.hidden   = true;
    $numpadArea.hidden   = true;
    $feedback.textContent = '';
    $feedback.className = 'feedback';
    $instruction.textContent = '';
    $levelModal.hidden = false;
    trapFocus($levelModal);
    const first = $levelGrid.querySelector('button');
    if (first) first.focus();
  }

  /* All (a,b) pairs with 1<=a,b<=10 whose product is in [min,max] */
  function computePairs(min, max) {
    const pairs = [];
    for (let a = 1; a <= 10; a++) {
      for (let b = 1; b <= 10; b++) {
        const p = a * b;
        if (p >= min && p <= max) pairs.push([a, b]);
      }
    }
    return pairs;
  }

  function startGame(key) {
    state.level = key;
    const lv = LEVELS[key];
    state.range = [lv.min, lv.max];
    state.validPairs = computePairs(lv.min, lv.max);
    state.progress = 0;
    state.locked = false;
    releaseFocus($levelModal);
    $levelModal.hidden = true;
    updateProgress();
    nextQuestion();
  }

  /* =====================================================
     QUESTION GENERATION
     ===================================================== */
  function pickPair() { return pick(state.validPairs); }

  function productDistractors(a, b) {
    const ans = a * b;
    const used = new Set([ans]);
    const out = [];
    const cands = shuffle([
      a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b,
      ans + a, ans - a, ans + b, ans - b, ans + 1, ans - 1, ans + 10, ans - 10,
    ]);
    cands.forEach(d => {
      if (out.length < 3 && d >= 1 && d <= 100 && !used.has(d)) {
        used.add(d); out.push(d);
      }
    });
    while (out.length < 3) {
      const r = rand(1, 100);
      if (!used.has(r)) { used.add(r); out.push(r); }
    }
    return out;
  }

  function genProductMC() {
    const [a, b] = pickPair();
    const answer = a * b;
    return { mode: 'mc', a, b, answer, choices: shuffle([answer, ...productDistractors(a, b)]) };
  }
  function genProductType() {
    const [a, b] = pickPair();
    return { mode: 'type', a, b, answer: a * b };
  }

  function pickGenerator() {
    return Math.random() < 0.5 ? genProductMC : genProductType;
  }

  /* =====================================================
     RENDERING
     ===================================================== */
  function renderQuestion(q) {
    state.locked = false;
    state.typed  = '';
    $feedback.textContent = '';
    $feedback.className    = 'feedback';
    $equationCard.hidden = true;
    $choiceArea.hidden   = true;
    $numpadArea.hidden   = true;
    $choiceArea.innerHTML = '';

    $instruction.textContent = S('instrProduct');
    renderEquation(q);

    if (q.mode === 'mc') {
      renderChoices(q);
    } else {
      $numpadArea.hidden = false;
      $numpadHint.textContent = S('numpadProduct');
      setSlotActive(true);
    }
  }

  function renderEquation(q) {
    $equationCard.hidden = false;
    const slot = `<span class="eq-slot" id="ansSlot" aria-label="${S('slotAria')}">?</span>`;
    $equation.innerHTML =
      `<span>${q.a}</span><span class="eq-op">×</span><span>${q.b}</span>` +
      `<span class="eq-eq">=</span>${slot}`;
  }

  function renderChoices(q) {
    $choiceArea.hidden = false;
    $choiceArea.innerHTML = '';
    q.choices.forEach((c, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'choice-btn color-' + ((i % 5) + 1);
      btn.textContent = String(c);
      btn.dataset.value = String(c);
      btn.addEventListener('click', () => onMCClicked(btn, c, q.answer));
      $choiceArea.appendChild(btn);
    });
  }

  /* =====================================================
     MANUAL ENTRY (numpad)
     ===================================================== */
  function slotEl() { return document.getElementById('ansSlot'); }

  function setSlotActive(on) {
    const el = slotEl();
    if (el) el.classList.toggle('active', on);
  }

  function renderTyped() {
    const el = slotEl();
    if (el) el.textContent = state.typed || '?';
  }

  function onNumpadKey(key) {
    if (state.locked || !state.current || state.current.mode !== 'type') return;
    if (key === 'back') {
      state.typed = state.typed.slice(0, -1);
    } else if (key === 'enter') {
      onCheckClicked();
      return;
    } else {
      if (state.typed.length >= 3) return;
      const num = parseInt(state.typed + key, 10);
      if (num > 100) return;
      state.typed = String(num);
    }
    renderTyped();
  }

  function onClearClicked() {
    if (state.locked || !state.current || state.current.mode !== 'type') return;
    state.typed = '';
    renderTyped();
    setSlotActive(true);
  }

  function onCheckClicked() {
    if (state.locked || !state.current || state.current.mode !== 'type') return;
    if (state.typed === '') {
      $feedback.textContent = S('fillFirst');
      $feedback.className = 'feedback bad';
      return;
    }
    const el = slotEl();
    if (parseInt(state.typed, 10) === state.current.answer) {
      if (el) el.classList.add('correct-flash');
      handleCorrect(null);
    } else {
      if (el) el.classList.add('wrong-flash');
      const ans = state.current.answer;
      setTimeout(() => { const e = slotEl(); if (e) e.textContent = String(ans); }, 600);
      handleWrong(null, ans);
    }
  }

  /* ---- MC click ---- */
  function onMCClicked(btn, value, correct) {
    if (state.locked) return;
    if (value === correct) handleCorrect(btn);
    else handleWrong(btn, correct);
  }

  /* =====================================================
     OUTCOME HANDLERS
     ===================================================== */
  function handleCorrect(btn) {
    state.locked = true;
    state.progress = Math.min(TARGET_PROGRESS, state.progress + INCREMENT_RIGHT);
    $feedback.textContent = pick(S('praise'));
    $feedback.className = 'feedback good';
    if (btn) btn.classList.add('correct-flash');
    updateProgress();
    if (state.progress >= TARGET_PROGRESS) setTimeout(showReward, 1000);
    else setTimeout(nextQuestion, FEEDBACK_DELAY);
  }

  function handleWrong(btn, correct) {
    state.locked = true;
    state.progress = Math.max(0, state.progress - DECREMENT_WRONG);
    $feedback.textContent = S('wrong', correct);
    $feedback.className = 'feedback bad';
    if (btn) btn.classList.add('wrong-flash');
    if (state.current.mode === 'mc') {
      [...$choiceArea.querySelectorAll('.choice-btn')].forEach(b => {
        if (parseInt(b.dataset.value, 10) === state.current.answer) b.classList.add('correct-flash');
      });
    }
    updateProgress();
    setTimeout(nextQuestion, FEEDBACK_DELAY + 900);
  }

  /* ---------- Main loop ---------- */
  function nextQuestion() {
    state.current = pickGenerator()();
    renderQuestion(state.current);
  }

  /* ---------- Reward ---------- */
  function showReward() {
    const reward = chooseReward(rewardStore.list);
    mountReward($rewardImgWrap, reward, S('rewardMissing'));
    spawnConfetti($confetti);
    $rewardModal.hidden = false;
    trapFocus($rewardModal);
    $playAgainBtn.focus();
  }

  /* ---------- Event listeners ---------- */
  $checkBtn.addEventListener('click', onCheckClicked);
  $clearBtn.addEventListener('click', onClearClicked);
  $playAgainBtn.addEventListener('click', showLevelSelect);
  $langToggleBtn.addEventListener('click', () => setLang(lang === 'tr' ? 'en' : 'tr'));

  [...$numpad.querySelectorAll('button')].forEach(btn => {
    btn.addEventListener('click', () => onNumpadKey(btn.dataset.key));
  });

  document.addEventListener('keydown', e => {
    if (state.locked || !state.current) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    const q = state.current;
    if (q.mode === 'type') {
      if (/^[0-9]$/.test(e.key))      onNumpadKey(e.key);
      else if (e.key === 'Backspace') onNumpadKey('back');
      else if (e.key === 'Enter')     onNumpadKey('enter');
    } else {
      if (['1', '2', '3', '4'].includes(e.key)) {
        const btns = $choiceArea.querySelectorAll('.choice-btn');
        const idx = parseInt(e.key, 10) - 1;
        if (btns[idx]) btns[idx].click();
      }
    }
  });

  /* ---------- Init ---------- */
  applyStaticStrings();
  updateProgress();
  showLevelSelect();
})();
</script>
</body>
</html>
