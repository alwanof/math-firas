<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
<title>Çıkarma Mekiği — İki Basamaklı Çıkarma</title>
<link rel="stylesheet" href="../shared/mf-design.css">
<style>
/* ============================================================
   Subtraction Shuttle / Çıkarma Mekiği — Grade 2 (MAT.2.2.2)
   Sequel to Subtraction Rocket. Two-digit minus two-digit.
   Level 1 (steps):  64 − 22 solved in two guided steps:
                     ① 64 − 20 = 44   ② 44 − 2 = 42
   Level 2 (direct): type the final answer immediately.
   Manual entry ONLY — numpad / keyboard, no multiple choice.
   ============================================================ */

.ambient { position: absolute; inset: 0; pointer-events: none; z-index: 0; }

main {
  position: relative; z-index: 2; flex: 1;
  display: flex; flex-direction: column;
  align-items: center; gap: 0.7rem;
  padding: 1rem 0.75rem 100px;
  overflow-y: auto;
}

/* ---- Header extras ---- */
.header-end {
  flex: 1;
  max-width: 540px;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.difficulty-badge.steps  { background: var(--b4); color: #fff; }
.difficulty-badge.direct { background: var(--b1); color: #fff; }

/* ---- Prompt card ---- */
.prompt-card {
  width: min(820px, 96vw);
  background: rgba(255,255,255,0.92);
  border: 4px solid var(--ink);
  border-radius: 16px;
  padding: 0.55rem 1rem;
  box-shadow: 5px 5px 0 var(--ink);
  text-align: center;
  position: relative;
}
.prompt-card::before, .prompt-card::after {
  content: "";
  position: absolute;
  top: -10px;
  width: 16px; height: 16px;
  background: var(--sun);
  border: 3px solid var(--ink);
  border-radius: 50%;
  box-shadow: 1px 2px 0 var(--ink);
}
.prompt-card::before { left: -10px; }
.prompt-card::after  { right: -10px; }
.instruction {
  font-size: clamp(0.95rem, 2.4vw, 1.2rem);
  font-weight: 800;
  color: var(--ink);
}

/* ---- Equation card (main problem) ---- */
.equation-card {
  width: min(820px, 96vw);
  background: rgba(255,255,255,0.7);
  border: 4px solid var(--ink);
  border-radius: 18px;
  padding: 1rem 0.75rem;
  box-shadow: 5px 5px 0 var(--ink);
}
.equation {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 0.35rem 0.5rem;
  font-size: clamp(2rem, 8vw, 3.6rem);
  font-weight: 900;
  color: var(--ink);
  line-height: 1;
}
.eq-op, .eq-eq {
  color: var(--warm);
  text-shadow: 3px 3px 0 var(--ink);
}
.eq-slot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1.6em;
  padding: 0.05em 0.25em;
  border: 4px dashed var(--warm);
  border-radius: 14px;
  background: #fff;
  color: var(--warm);
  text-shadow: 2px 2px 0 var(--ink);
}
.eq-slot.active {
  border-style: solid;
  border-color: var(--good);
  animation: slotPulse 1.1s ease-in-out infinite;
}
.eq-slot.done {
  border-style: solid;
  border-color: var(--good);
  color: var(--good);
  text-shadow: none;
}
@keyframes slotPulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.07); }
}
.eq-slot.correct-flash { animation: correctPulse 0.6s ease; background: var(--good) !important; color: #fff; }
.eq-slot.wrong-flash   { animation: wrongShake  0.5s ease;  background: var(--bad)  !important; color: #fff; }

/* ---- Step-by-step card (Level 1) ---- */
.steps-card {
  width: min(820px, 96vw);
  background: rgba(255,255,255,0.88);
  border: 4px solid var(--ink);
  border-radius: 18px;
  padding: 0.7rem 0.75rem;
  box-shadow: 5px 5px 0 var(--ink);
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}
.step-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  opacity: 0.45;
  transition: opacity 0.25s ease;
}
.step-row.on   { opacity: 1; }
.step-row[hidden] { display: none; }
.step-num {
  flex: none;
  width: 2em; height: 2em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 0.95rem;
  color: #fff;
  background: var(--b4);
  border: 3px solid var(--ink);
  border-radius: 50%;
  box-shadow: 2px 2px 0 var(--ink);
}
.step-row.row-2 .step-num { background: var(--b5); }
.step-eq {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.25rem 0.4rem;
  font-size: clamp(1.4rem, 5.5vw, 2.4rem);
  font-weight: 900;
  color: var(--ink);
  line-height: 1;
}
.step-eq .eq-slot { border-width: 3px; border-radius: 10px; }

/* ---- Shuttle progress decoration ---- */
.shuttle-track {
  width: min(820px, 96vw);
  display: flex;
  align-items: center;
  gap: 0.2rem;
  font-size: clamp(1.1rem, 3vw, 1.6rem);
  user-select: none;
}
.shuttle-track .trail {
  flex: 1;
  height: 8px;
  border: 2px solid var(--ink);
  border-radius: 6px;
  background: rgba(255,255,255,0.7);
  overflow: hidden;
}
.shuttle-track .trail-fill {
  height: 100%;
  width: 0%;
  background: var(--b5);
  transition: width 0.5s ease;
}

/* ---- Numpad area ---- */
.numpad-area {
  width: min(360px, 95vw);
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  align-items: center;
}
.numpad-hint {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--ink);
  background: rgba(255,255,255,0.88);
  padding: 0.3rem 0.7rem;
  border-radius: 8px;
  border: 2px solid var(--ink);
  text-align: center;
}
.numpad { width: 100%; }
.numpad button { font-size: 1.4rem; padding: 0.55rem 0; }
.numpad button.action { background: var(--warm); color: #fff; }
.numpad button.submit { background: var(--good);  color: #fff; }

.action-row {
  width: min(360px, 95vw);
  display: flex;
  gap: 0.5rem;
  justify-content: center;
}
.action-btn {
  font-family: inherit;
  font-weight: 900;
  font-size: clamp(0.9rem, 2.3vw, 1.05rem);
  padding: 0.55rem 1.1rem;
  border: 4px solid var(--ink);
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 4px 4px 0 var(--ink);
}
.action-btn.check  { background: var(--good); color: #fff; flex: 2; min-width: 120px; }
.action-btn.clear  { background: #fff;        color: var(--ink); flex: 1; min-width: 90px; }
.action-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
.action-btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.action-btn[disabled] { opacity: 0.4; cursor: not-allowed; }

/* ---- Level select overlay ---- */
.level-modal {
  position: fixed;
  inset: 0;
  background: rgba(31,29,44,0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 120;
  padding: 1rem;
  backdrop-filter: blur(4px);
}
.level-modal[hidden] { display: none; }
.level-card {
  background: #fff;
  border: 5px solid var(--ink);
  border-radius: 24px;
  padding: 1.5rem;
  box-shadow: 10px 10px 0 var(--ink);
  text-align: center;
  max-width: 520px;
  width: 94vw;
  animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
}
.level-card h2 {
  font-size: clamp(1.5rem, 5vw, 2.1rem);
  color: var(--warm);
  text-shadow: 3px 3px 0 var(--ink);
  margin-bottom: 0.4rem;
}
.level-caption {
  font-weight: 700;
  color: var(--ink-soft);
  margin-bottom: 1.1rem;
}
.level-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.8rem;
}
.level-btn {
  font-family: inherit;
  cursor: pointer;
  border: 4px solid var(--ink);
  border-radius: 16px;
  padding: 1rem 0.5rem;
  box-shadow: 5px 5px 0 var(--ink);
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  align-items: center;
  color: #fff;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.level-btn:hover  { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); }
.level-btn:active { transform: translate(2px, 2px);   box-shadow: 2px 2px 0 var(--ink); }
.level-btn:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }
.level-btn .lv-name  { font-size: 1.4rem; font-weight: 900; text-shadow: 2px 2px 0 rgba(0,0,0,0.28); }
.level-btn .lv-range {
  font-size: 1rem;
  font-weight: 800;
  background: rgba(255,255,255,0.9);
  color: var(--ink);
  border: 2px solid var(--ink);
  border-radius: 8px;
  padding: 0.05rem 0.55rem;
}
.level-btn.steps  { background: var(--b4); }
.level-btn.direct { background: var(--b1); }

/* ---- Mobile tweaks ---- */
@media (max-width: 560px) {
  .header-end { max-width: none; }
  .numpad-area { width: 95vw; }
  .equation { font-size: clamp(1.8rem, 11vw, 2.8rem); }
}
</style>
</head>
<body>
<div id="app">

  <!-- Ambient background layers -->
  <div class="ambient" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
  </div>
  <div class="road" aria-hidden="true">
    <div class="car car-1">🚗</div>
    <div class="car car-2">🚙</div>
    <div class="car car-3">🚕</div>
  </div>

  <!-- Header -->
  <header>
    <div class="title" id="titleEl">🛸 Çıkarma Mekiği</div>
    <div class="header-end">
      <span class="difficulty-badge" id="difficultyBadge"></span>
      <div class="progress-wrap" role="progressbar"
           aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"
           aria-label="İlerleme" id="progressBar">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">0 / 10</div>
      </div>
      <button class="lang-toggle" id="langToggleBtn" type="button">EN</button>
    </div>
  </header>

  <!-- Main game area -->
  <main>

    <!-- Prompt -->
    <section class="prompt-card">
      <div class="instruction" id="instruction"></div>
    </section>

    <!-- Main equation -->
    <section class="equation-card" id="equationCard" hidden>
      <div class="equation" id="equation"></div>
    </section>

    <!-- Guided steps (Level 1 only) -->
    <section class="steps-card" id="stepsCard" hidden>
      <div class="step-row row-1" id="stepRow1">
        <span class="step-num" aria-hidden="true">1</span>
        <div class="step-eq" id="stepEq1"></div>
      </div>
      <div class="step-row row-2" id="stepRow2" hidden>
        <span class="step-num" aria-hidden="true">2</span>
        <div class="step-eq" id="stepEq2"></div>
      </div>
    </section>

    <!-- Shuttle flight decoration mirroring progress -->
    <div class="shuttle-track" aria-hidden="true">
      <span>🌍</span>
      <div class="trail"><div class="trail-fill" id="trailFill"></div></div>
      <span>🛸</span>
      <span>🛰️</span>
    </div>

    <!-- Numpad (manual entry — the only answer mode) -->
    <div class="numpad-area" id="numpadArea" hidden>
      <div class="numpad-hint" id="numpadHint"></div>
      <div class="numpad" id="numpad">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" class="action" data-key="back" id="backspaceBtn">⌫</button>
        <button type="button" data-key="0">0</button>
        <button type="button" class="submit" data-key="enter" id="enterBtn">↵</button>
      </div>
      <div class="action-row">
        <button class="action-btn clear" id="clearBtn" type="button">🧹 Temizle</button>
        <button class="action-btn check" id="checkBtn" type="button">✓ Kontrol</button>
      </div>
    </div>

    <!-- Feedback -->
    <div class="feedback" id="feedback" aria-live="polite"></div>

  </main>

  <!-- Level select overlay -->
  <div class="level-modal" id="levelModal"
       role="dialog" aria-modal="true" aria-labelledby="levelTitle">
    <div class="level-card">
      <h2 id="levelTitle">Bir seviye seç</h2>
      <p class="level-caption" id="levelCaption">Nasıl çözmek istersin?</p>
      <div class="level-grid" id="levelGrid"></div>
    </div>
  </div>

  <!-- Reward modal -->
  <div class="reward-modal" id="rewardModal" hidden
       role="dialog" aria-modal="true" aria-labelledby="rewardTitle">
    <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
    <div class="reward-card">
      <h2 id="rewardTitle">🎉 Çıkarma Ustası! 🎉</h2>
      <div class="reward-image-wrap" id="rewardImageWrap"></div>
      <p class="reward-msg" id="rewardMsg">Mekik uzay istasyonuna ulaştı!</p>
      <button class="play-again" id="playAgainBtn" type="button">Tekrar Oyna</button>
    </div>
  </div>

</div>
<script src="../shared/mf-core.js"></script>
<script>
(() => {
  'use strict';

  const { rand, pick, loadRewards, chooseReward, mountReward,
          spawnConfetti, trapFocus, releaseFocus } = MF;

  /* ---------- Config ---------- */
  const TARGET_PROGRESS = 10;
  const INCREMENT_RIGHT = 1;
  const DECREMENT_WRONG = 1;
  const FEEDBACK_DELAY  = 1300;

  /* Levels: 'steps' = guided two-step solving, 'direct' = final answer only */
  const LEVEL_ORDER = ['steps', 'direct'];
  const LEVELS = {
    steps:  { nameKey: 'levelSteps',  hintKey: 'levelStepsHint',  cls: 'steps'  },
    direct: { nameKey: 'levelDirect', hintKey: 'levelDirectHint', cls: 'direct' },
  };

  /* ---------- Bilingual strings ---------- */
  const STRINGS = {
    en: {
      title:        '🛸 Subtraction Shuttle',
      langToggle:   'TR',
      progressAria: 'Progress',

      levelTitle:      'Choose a level',
      levelCaption:    'How do you want to solve?',
      levelSteps:      'Level 1 — Step by Step',
      levelStepsHint:  'first the tens, then the ones',
      levelDirect:     'Level 2 — Direct Answer',
      levelDirectHint: 'type the answer in one go',

      instrSteps:  'Solve it in two steps: first subtract the tens, then the ones.',
      instrDirect: 'What is the difference? Type the answer.',

      hintStep1: (t) => `Step 1: subtract the tens (− ${t}), then ↵`,
      hintStep2: (o) => `Step 2: subtract the ones (− ${o}), then ↵`,
      hintFinal: 'Type the answer, then ↵',

      fillFirst: '🛸 Type an answer first!',

      checkBtn:      '✓ Check',
      clearBtn:      '🧹 Clear',
      backspaceAria: 'Backspace',
      enterAria:     'Check answer',
      slotAria:      'Empty answer box',

      stepGood: ['🛸 Great! Now the ones.', '⭐ Step 1 done — keep going!', '✨ Nice! One step left.'],
      praise:   ['🛸 Correct!', '⭐ Perfect!', '✨ Brilliant!', '🛰️ Closer to the station!', '🌟 Smooth flight!'],
      wrong:    (ans) => `🛸 The answer was ${ans}. Keep going!`,

      rewardTitle:   '🎉 Subtraction Master! 🎉',
      rewardMsg:     'Your shuttle reached the space station!',
      playAgain:     'Play Again',
      rewardMissing: '(reward image missing)',
    },
    tr: {
      title:        '🛸 Çıkarma Mekiği',
      langToggle:   'EN',
      progressAria: 'İlerleme',

      levelTitle:      'Bir seviye seç',
      levelCaption:    'Nasıl çözmek istersin?',
      levelSteps:      '1. Seviye — Adım Adım',
      levelStepsHint:  'önce onluklar, sonra birlikler',
      levelDirect:     '2. Seviye — Direkt Cevap',
      levelDirectHint: 'cevabı tek seferde yaz',

      instrSteps:  'İki adımda çöz: önce onlukları, sonra birlikleri çıkar.',
      instrDirect: 'Fark kaç? Cevabı yaz.',

      hintStep1: (t) => `1. Adım: onlukları çıkar (− ${t}), sonra ↵`,
      hintStep2: (o) => `2. Adım: birlikleri çıkar (− ${o}), sonra ↵`,
      hintFinal: 'Cevabı yaz, sonra ↵',

      fillFirst: '🛸 Önce bir cevap yaz!',

      checkBtn:      '✓ Kontrol',
      clearBtn:      '🧹 Temizle',
      backspaceAria: 'Geri sil',
      enterAria:     'Cevabı kontrol et',
      slotAria:      'Boş cevap kutusu',

      stepGood: ['🛸 Süper! Şimdi birlikler.', '⭐ 1. adım tamam — devam!', '✨ Güzel! Bir adım kaldı.'],
      praise:   ['🛸 Doğru!', '⭐ Mükemmel!', '✨ Harika!', '🛰️ İstasyona yaklaşıyorsun!', '🌟 Yumuşak uçuş!'],
      wrong:    (ans) => `🛸 Cevap ${ans} idi. Devam et!`,

      rewardTitle:   '🎉 Çıkarma Ustası! 🎉',
      rewardMsg:     'Mekik uzay istasyonuna ulaştı!',
      playAgain:     'Tekrar Oyna',
      rewardMissing: '(ödül resmi eksik)',
    },
  };

  /* ---------- i18n ---------- */
  let lang = localStorage.getItem('mf_lang') || 'tr';
  const S = (k, ...a) => {
    const v = STRINGS[lang][k];
    return typeof v === 'function' ? v(...a) : v;
  };

  const rewardStore = loadRewards();

  /* ---------- DOM refs ---------- */
  const $titleEl      = document.getElementById('titleEl');
  const $instruction  = document.getElementById('instruction');
  const $equationCard = document.getElementById('equationCard');
  const $equation     = document.getElementById('equation');
  const $stepsCard    = document.getElementById('stepsCard');
  const $stepRow1     = document.getElementById('stepRow1');
  const $stepRow2     = document.getElementById('stepRow2');
  const $stepEq1      = document.getElementById('stepEq1');
  const $stepEq2      = document.getElementById('stepEq2');
  const $numpadArea   = document.getElementById('numpadArea');
  const $numpad       = document.getElementById('numpad');
  const $numpadHint   = document.getElementById('numpadHint');
  const $checkBtn     = document.getElementById('checkBtn');
  const $clearBtn     = document.getElementById('clearBtn');
  const $backspaceBtn = document.getElementById('backspaceBtn');
  const $enterBtn     = document.getElementById('enterBtn');
  const $feedback     = document.getElementById('feedback');
  const $progressFill = document.getElementById('progressFill');
  const $progressText = document.getElementById('progressText');
  const $progressBar  = document.getElementById('progressBar');
  const $trailFill    = document.getElementById('trailFill');
  const $diffBadge    = document.getElementById('difficultyBadge');
  const $levelModal   = document.getElementById('levelModal');
  const $levelTitle   = document.getElementById('levelTitle');
  const $levelCaption = document.getElementById('levelCaption');
  const $levelGrid    = document.getElementById('levelGrid');
  const $rewardModal  = document.getElementById('rewardModal');
  const $rewardTitle  = document.getElementById('rewardTitle');
  const $rewardMsg    = document.getElementById('rewardMsg');
  const $rewardImgWrap = document.getElementById('rewardImageWrap');
  const $confetti     = document.getElementById('confettiLayer');
  const $playAgainBtn = document.getElementById('playAgainBtn');
  const $langToggleBtn = document.getElementById('langToggleBtn');

  /* ---------- State ---------- */
  const state = {
    level:    null,      // 'steps' | 'direct'
    phase:    null,      // 'step1' | 'step2' | 'final'
    progress: 0,
    current:  null,
    locked:   false,
    typed:    '',
  };

  /* ---------- Static strings ---------- */
  function applyStaticStrings() {
    document.documentElement.lang = lang;
    document.title = lang === 'tr'
      ? 'Çıkarma Mekiği — İki Basamaklı Çıkarma'
      : 'Subtraction Shuttle — Two-Digit Subtraction';
    $titleEl.textContent       = S('title');
    $langToggleBtn.textContent = S('langToggle');
    $checkBtn.textContent      = S('checkBtn');
    $clearBtn.textContent      = S('clearBtn');
    $backspaceBtn.setAttribute('aria-label', S('backspaceAria'));
    $enterBtn.setAttribute('aria-label',     S('enterAria'));
    $rewardTitle.textContent   = S('rewardTitle');
    $rewardMsg.textContent     = S('rewardMsg');
    $playAgainBtn.textContent  = S('playAgain');
    $progressBar.setAttribute('aria-label', S('progressAria'));
    $levelTitle.textContent    = S('levelTitle');
    $levelCaption.textContent  = S('levelCaption');
    renderLevelButtons();
    updateDiffBadge();
  }

  function setLang(next) {
    lang = next;
    localStorage.setItem('mf_lang', lang);
    applyStaticStrings();
    if (state.current) renderQuestion(state.current, /*keepPhase*/ true);
  }

  /* ---------- Difficulty badge + progress ---------- */
  function updateDiffBadge() {
    if (!state.level) { $diffBadge.textContent = ''; $diffBadge.className = 'difficulty-badge'; return; }
    const lv = LEVELS[state.level];
    $diffBadge.textContent = S(lv.nameKey).replace(/^.*— /, '');
    $diffBadge.className   = 'difficulty-badge ' + lv.cls;
  }
  function updateProgress() {
    const pct = (state.progress / TARGET_PROGRESS) * 100;
    $progressFill.style.width = pct + '%';
    $trailFill.style.width    = pct + '%';
    $progressText.textContent = state.progress + ' / ' + TARGET_PROGRESS;
    $progressBar.setAttribute('aria-valuenow', String(state.progress));
    updateDiffBadge();
  }

  /* ---------- Level select ---------- */
  function renderLevelButtons() {
    $levelGrid.innerHTML = '';
    LEVEL_ORDER.forEach(key => {
      const lv = LEVELS[key];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'level-btn ' + lv.cls;
      btn.dataset.level = key;
      btn.innerHTML =
        '<span class="lv-name">' + S(lv.nameKey) + '</span>' +
        '<span class="lv-range">' + S(lv.hintKey) + '</span>';
      btn.addEventListener('click', () => startGame(key));
      $levelGrid.appendChild(btn);
    });
  }

  function showLevelSelect() {
    state.current = null;
    state.locked  = false;
    releaseFocus($rewardModal);
    $rewardModal.hidden = true;
    $confetti.innerHTML = '';
    $equationCard.hidden = true;
    $stepsCard.hidden    = true;
    $numpadArea.hidden   = true;
    $feedback.textContent = '';
    $feedback.className = 'feedback';
    $instruction.textContent = '';
    $levelModal.hidden = false;
    trapFocus($levelModal);
    const first = $levelGrid.querySelector('button');
    if (first) first.focus();
  }

  function startGame(key) {
    state.level = key;
    state.progress = 0;
    state.locked = false;
    releaseFocus($levelModal);
    $levelModal.hidden = true;
    /* Drop focus from the hidden level button so a later Enter
       keypress cannot re-activate it and restart the game. */
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    updateProgress();
    nextQuestion();
  }

  /* =====================================================
     QUESTION GENERATION
     a, b both two-digit; a > b so the answer is positive.
     b's ones digit >= 1 so step 2 is never "subtract 0".
     Decomposition: a − b = (a − tens(b)) − ones(b).
     e.g. 64 − 22 → ① 64 − 20 = 44 → ② 44 − 2 = 42
     ===================================================== */
  function genQuestion() {
    const bTens = rand(1, 7) * 10;         // 10..70
    const bOnes = rand(1, 9);              // 1..9
    const b = bTens + bOnes;               // 11..79
    const a = rand(b + 1, 99);             // two-digit, a > b
    return { a, b, bTens, bOnes, step1: a - bTens, answer: a - b };
  }

  /* =====================================================
     RENDERING
     ===================================================== */
  const slotHTML = (id, cls) =>
    `<span class="eq-slot ${cls || ''}" id="${id}" aria-label="${S('slotAria')}">?</span>`;

  function renderQuestion(q, keepPhase) {
    state.locked = false;
    state.typed  = '';
    if (!keepPhase) state.phase = state.level === 'steps' ? 'step1' : 'final';
    $feedback.textContent = '';
    $feedback.className   = 'feedback';

    $instruction.textContent = state.level === 'steps' ? S('instrSteps') : S('instrDirect');

    /* Main equation — the answer slot is the input in direct mode only */
    $equationCard.hidden = false;
    $equation.innerHTML =
      `<span>${q.a}</span><span class="eq-op">−</span><span>${q.b}</span>` +
      `<span class="eq-eq">=</span>` +
      slotHTML('ansSlot', state.level === 'direct' ? 'active' : '');

    /* Guided steps — Level 1 only */
    if (state.level === 'steps') {
      $stepsCard.hidden = false;
      $stepEq1.innerHTML =
        `<span>${q.a}</span><span class="eq-op">−</span><span>${q.bTens}</span>` +
        `<span class="eq-eq">=</span>` + slotHTML('slotStep1');
      $stepEq2.innerHTML =
        `<span>${q.step1}</span><span class="eq-op">−</span><span>${q.bOnes}</span>` +
        `<span class="eq-eq">=</span>` + slotHTML('slotStep2');
      applyPhaseToSteps();
    } else {
      $stepsCard.hidden = true;
      $numpadHint.textContent = S('hintFinal');
    }

    $numpadArea.hidden = false;
  }

  /* Sync step rows, slots, and numpad hint with the current phase */
  function applyPhaseToSteps() {
    const q = state.current;
    const s1 = document.getElementById('slotStep1');
    const s2 = document.getElementById('slotStep2');
    if (state.phase === 'step1') {
      $stepRow1.hidden = false; $stepRow1.classList.add('on');
      $stepRow2.hidden = true;  $stepRow2.classList.remove('on');
      if (s1) { s1.classList.add('active'); s1.textContent = state.typed || '?'; }
      $numpadHint.textContent = S('hintStep1', q.bTens);
    } else if (state.phase === 'step2') {
      $stepRow1.hidden = false; $stepRow1.classList.remove('on');
      $stepRow2.hidden = false; $stepRow2.classList.add('on');
      if (s1) { s1.classList.remove('active'); s1.classList.add('done'); s1.textContent = String(q.step1); }
      if (s2) { s2.classList.add('active'); s2.textContent = state.typed || '?'; }
      $numpadHint.textContent = S('hintStep2', q.bOnes);
    }
  }

  /* =====================================================
     MANUAL ENTRY (numpad)
     ===================================================== */
  function activeSlot() {
    if (state.phase === 'step1') return document.getElementById('slotStep1');
    if (state.phase === 'step2') return document.getElementById('slotStep2');
    return document.getElementById('ansSlot');
  }
  function expectedAnswer() {
    return state.phase === 'step1' ? state.current.step1 : state.current.answer;
  }

  function renderTyped() {
    const el = activeSlot();
    if (el) el.textContent = state.typed || '?';
  }

  function onNumpadKey(key) {
    if (state.locked || !state.current) return;
    if (key === 'back') {
      state.typed = state.typed.slice(0, -1);
    } else if (key === 'enter') {
      onCheckClicked();
      return;
    } else {
      if (state.typed.length >= 2) return;   // all answers are at most 2 digits
      state.typed = String(parseInt(state.typed + key, 10));
    }
    renderTyped();
  }

  function onClearClicked() {
    if (state.locked || !state.current) return;
    state.typed = '';
    renderTyped();
  }

  function onCheckClicked() {
    if (state.locked || !state.current) return;
    if (state.typed === '') {
      $feedback.textContent = S('fillFirst');
      $feedback.className = 'feedback bad';
      return;
    }
    const el = activeSlot();
    const expected = expectedAnswer();
    if (parseInt(state.typed, 10) === expected) {
      if (el) el.classList.add('correct-flash');
      if (state.phase === 'step1') advanceToStep2();
      else handleCorrect();
    } else {
      if (el) el.classList.add('wrong-flash');
      setTimeout(() => { const e = activeSlot(); if (e) e.textContent = String(expected); }, 600);
      handleWrong(expected);
    }
  }

  /* Step 1 solved → move on to step 2 of the same question */
  function advanceToStep2() {
    state.phase = 'step2';
    state.typed = '';
    $feedback.textContent = pick(S('stepGood'));
    $feedback.className = 'feedback good';
    setTimeout(() => {
      if (!state.current || state.locked || state.phase !== 'step2') return;
      $feedback.textContent = '';
      $feedback.className = 'feedback';
      applyPhaseToSteps();
    }, 700);
  }

  /* =====================================================
     OUTCOME HANDLERS
     ===================================================== */
  function handleCorrect() {
    state.locked = true;
    state.progress = Math.min(TARGET_PROGRESS, state.progress + INCREMENT_RIGHT);
    /* In steps mode, echo the final answer into the main equation slot */
    const fin = document.getElementById('ansSlot');
    if (fin) { fin.textContent = String(state.current.answer); fin.classList.add('correct-flash'); }
    $feedback.textContent = pick(S('praise'));
    $feedback.className = 'feedback good';
    updateProgress();
    if (state.progress >= TARGET_PROGRESS) setTimeout(showReward, 1000);
    else setTimeout(nextQuestion, FEEDBACK_DELAY);
  }

  function handleWrong(expected) {
    state.locked = true;
    state.progress = Math.max(0, state.progress - DECREMENT_WRONG);
    $feedback.textContent = S('wrong', expected);
    $feedback.className = 'feedback bad';
    updateProgress();
    setTimeout(nextQuestion, FEEDBACK_DELAY + 900);
  }

  /* ---------- Main loop ---------- */
  function nextQuestion() {
    state.current = genQuestion();
    renderQuestion(state.current);
  }

  /* ---------- Reward ---------- */
  function showReward() {
    const reward = chooseReward(rewardStore.list);
    mountReward($rewardImgWrap, reward, S('rewardMissing'));
    spawnConfetti($confetti);
    $rewardModal.hidden = false;
    trapFocus($rewardModal);
    $playAgainBtn.focus();
  }

  /* ---------- Event listeners ---------- */
  $checkBtn.addEventListener('click', onCheckClicked);
  $clearBtn.addEventListener('click', onClearClicked);
  $playAgainBtn.addEventListener('click', showLevelSelect);
  $langToggleBtn.addEventListener('click', () => setLang(lang === 'tr' ? 'en' : 'tr'));

  [...$numpad.querySelectorAll('button')].forEach(btn => {
    btn.addEventListener('click', () => onNumpadKey(btn.dataset.key));
  });

  document.addEventListener('keydown', e => {
    if (state.locked || !state.current) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (/^[0-9]$/.test(e.key))      { e.preventDefault(); onNumpadKey(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); onNumpadKey('back'); }
    else if (e.key === 'Enter')     { e.preventDefault(); onNumpadKey('enter'); }
  });

  /* ---------- Init ---------- */
  applyStaticStrings();
  updateProgress();
  showLevelSelect();
})();
</script>
</body>
</html>
